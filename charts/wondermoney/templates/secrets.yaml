{{- /*
The generated secrets: created once, then read back with `lookup` and kept as they are on every
upgrade. Helm keeps this Secret on uninstall too, so a reinstall under the same release name
finds the same keys.
*/}}
{{- $name := include "wondermoney.generatedSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := dict }}
{{- range $key, $value := (get $existing "data" | default dict) }}
{{- $_ := set $data $key $value }}
{{- end }}
{{- range $key := include "wondermoney.generatedSecretKeys" . | fromYamlArray }}
{{- if not (hasKey $data $key) }}
{{- if eq $key "CREDENTIAL_ENCRYPTION_KEY_V1" }}
{{- /* Must be base64 decoding to exactly 32 bytes; randBytes returns the base64. */}}
{{- $_ := set $data $key (randBytes 32 | b64enc) }}
{{- else }}
{{- $_ := set $data $key (randAlphaNum 64 | b64enc) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "wondermoney.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if $data }}
data:
  {{- range $key := keys $data | sortAlpha }}
  {{ $key }}: {{ get $data $key | quote }}
  {{- end }}
{{- end }}
---
{{- $values := include "wondermoney.secretValues" . | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wondermoney.secretName" . }}
  labels:
    {{- include "wondermoney.labels" . | nindent 4 }}
type: Opaque
{{- if $values }}
data:
  {{- range $key := keys $values | sortAlpha }}
  {{ $key }}: {{ get $values $key | b64enc | quote }}
  {{- end }}
{{- end }}
