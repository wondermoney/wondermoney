# Self-hosted WonderMoney: Postgres, the API, its background worker and the web app.
#
#   ./generate-env.sh          # creates .env with fresh secrets (once)
#   docker compose up -d       # http://localhost:3000
#
# Optional extras, by profile (set COMPOSE_PROFILES in .env so every command includes them):
#   proxy     Caddy, an HTTPS front door for one hostname: /v1/* and /api/auth/* to the API,
#             everything else to the web app (README.md, "HTTPS")
#   storage   SeaweedFS, an S3-compatible store for file uploads (CSV imports, receipt copies)
#   mail      Mailpit, to read outgoing mail at http://localhost:8025
#   backup    a daily database dump and copy of the storage volume in ./backups (README.md,
#             "Back up"); backup-offsite copies them to any rclone remote
#
# Set BIND_ADDRESS=127.0.0.1 in .env to publish the ports on this machine only, e.g. behind a
# reverse proxy on the same host.
#
# See README.md for HTTPS, upgrades and backups.

name: wondermoney

x-api-env: &api-env
  env_file: .env
  environment:
    DB_HOST: postgres
    DB_PORT: '5432'
    DB_DATABASE: ${POSTGRES_DB:-wondermoney}
    DB_USERNAME: ${POSTGRES_USER:-wondermoney}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?run ./generate-env.sh first}
    # pg-boss creates and upgrades its own schema; it takes a lock, so both can do it.
    PGBOSS_MIGRATE: 'true'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wondermoney}
      POSTGRES_USER: ${POSTGRES_USER:-wondermoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./generate-env.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies database migrations on every start (and, on an empty database, loads the reference
  # data), then serves the API.
  api:
    image: ${WM_IMAGE_REGISTRY:-ghcr.io/wondermoney}/wondermoney-api:${WM_VERSION:-latest}
    restart: unless-stopped
    <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${BIND_ADDRESS:+${BIND_ADDRESS}:}${API_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/v1/health']
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10

  # Background jobs: bank and price syncs, imports, scheduled emails. The only process that
  # runs the schedules.
  worker:
    image: ${WM_IMAGE_REGISTRY:-ghcr.io/wondermoney}/wondermoney-worker:${WM_VERSION:-latest}
    restart: unless-stopped
    <<: *api-env
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: ${POSTGRES_DB:-wondermoney}
      DB_USERNAME: ${POSTGRES_USER:-wondermoney}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run ./generate-env.sh first}
      PGBOSS_MIGRATE: 'true'
      PGBOSS_SCHEDULE: 'true'
    depends_on:
      api:
        condition: service_healthy
    # Unhealthy when pg-boss has stopped or the worker cannot reach Postgres. For whether jobs
    # actually run, monitor the API's /v1/health/ready (README.md, "Monitor").
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -o /dev/null "http://localhost:$${WORKER_HEALTH_PORT:-$${PORT:-3001}}/health"']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Only the settings the web app reads: it never sees the database password or the API's
  # secrets.
  web:
    image: ${WM_IMAGE_REGISTRY:-ghcr.io/wondermoney}/wondermoney-web:${WM_VERSION:-latest}
    restart: unless-stopped
    environment:
      # What browsers use.
      NEXT_PUBLIC_API_URL: ${API_URL:?set API_URL in .env}
      NEXT_PUBLIC_APP_URL: ${APP_URL:?set APP_URL in .env}
      # What the web server uses for its own requests (localhost would be the web container).
      API_INTERNAL_URL: http://api:3001
      NEXT_PUBLIC_AUTH_COOKIE_DOMAIN: ${NEXT_PUBLIC_AUTH_COOKIE_DOMAIN:-}
      NEXT_PUBLIC_TERMS_URL: ${NEXT_PUBLIC_TERMS_URL:-}
      NEXT_PUBLIC_PRIVACY_URL: ${NEXT_PUBLIC_PRIVACY_URL:-}
      NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      # Analytics: off unless set (see .env).
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${BIND_ADDRESS:+${BIND_ADDRESS}:}${WEB_PORT:-3000}:3000'

  # Optional HTTPS front door: one hostname for the web app and the API, with a certificate
  # fetched and renewed automatically when the host is public (plain HTTP for localhost).
  # Add `proxy` to COMPOSE_PROFILES and set API_URL to APP_URL; see README.md, "HTTPS".
  proxy:
    profiles: [proxy]
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      APP_URL: ${APP_URL:?set APP_URL in .env}
      API_URL: ${API_URL:?set API_URL in .env}
    ports:
      - '${PROXY_HTTP_PORT:-80}:80'
      - '${PROXY_HTTPS_PORT:-443}:443'
      - '${PROXY_HTTPS_PORT:-443}:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    # The Caddyfile is written from APP_URL at start: one site, path-routed. With a public
    # hostname Caddy obtains the certificate itself; localhost gets plain HTTP on port 80.
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ "$$API_URL" != "$$APP_URL" ]; then
          echo "The proxy profile serves one hostname: set API_URL to APP_URL ($$APP_URL)." >&2
          exit 1
        fi
        host=$${APP_URL#*://}
        host=$${host%%/*}
        case "$$host" in
          localhost|127.0.0.1|\[::1\]) site="http://$$host" ;;
          *:*)
            echo "APP_URL must not carry a port with the proxy profile: it serves 80 and 443." >&2
            exit 1
            ;;
          *) site="$$host" ;;
        esac
        cat > /etc/caddy/Caddyfile <<EOF
        $$site {
          handle /v1/* {
            reverse_proxy api:3001
          }
          handle /api/auth/* {
            reverse_proxy api:3001
          }
          handle {
            reverse_proxy web:3000
          }
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

  # S3-compatible storage. AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in .env are its only
  # credentials; it refuses to start without them rather than serve files to anyone.
  storage:
    profiles: [storage]
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        [ -n "$${AWS_ACCESS_KEY_ID}" ] && [ -n "$${AWS_SECRET_ACCESS_KEY}" ]
        || { echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in .env first." >&2; exit 1; };
        exec weed server -dir=/data -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - storage-data:/data
    ports:
      - '${BIND_ADDRESS:+${BIND_ADDRESS}:}${S3_PORT:-9000}:8333'
    # The S3 gateway's own health endpoint: it answers once the gateway is serving.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:8333/healthz']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  # Creates the bucket once the store is healthy, then exits.
  storage-init:
    profiles: [storage]
    image: chrislusf/seaweedfs:4.48
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        until echo s3.bucket.list | weed shell -master=storage:9333 > /tmp/buckets 2>/dev/null; do sleep 2; done;
        if grep -qw "$${S3_BUCKET}" /tmp/buckets; then echo "bucket $${S3_BUCKET} exists";
        else echo "s3.bucket.create -name $${S3_BUCKET}" | weed shell -master=storage:9333; fi
    environment:
      S3_BUCKET: ${S3_BUCKET:-wondermoney}

  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:+${BIND_ADDRESS}:}${MAILPIT_PORT:-8025}:8025'

  # Scheduled backups: on BACKUP_SCHEDULE, a pg_dump of the database and a copy of the
  # storage-data volume into BACKUP_DIR/<timestamp>, kept BACKUP_KEEP_DAYS days. Also runs one-off:
  #   docker compose run --rm backup now | list | restore <folder|latest>
  # It gets the database login, never the rest of .env. README.md, "Back up".
  backup:
    profiles: [backup]
    image: postgres:16-alpine
    restart: unless-stopped
    # A real PID 1, so `docker compose stop` ends the scheduler at once.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/usr/local/bin/wondermoney-backup']
    command: ['schedule']
    environment:
      BACKUP_ROLE: local
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      TZ: ${BACKUP_TZ:-UTC}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-wondermoney}
      PGUSER: ${POSTGRES_USER:-wondermoney}
      PGPASSWORD: ${POSTGRES_PASSWORD:?run ./generate-env.sh first}
    volumes:
      - ./backup/backup.sh:/usr/local/bin/wondermoney-backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - storage-data:/storage

  # Off-site copies: on BACKUP_OFFSITE_SCHEDULE, copies the finished backups in BACKUP_DIR to
  # BACKUP_DESTINATION (any rclone remote, set up with `docker compose run --rm backup-offsite
  # config`) and deletes the copies there older than BACKUP_OFFSITE_KEEP_DAYS. It sees only
  # BACKUP_DIR and ./rclone: .env is never copied.
  backup-offsite:
    profiles: [backup-offsite]
    image: rclone/rclone:1.76
    restart: unless-stopped
    # A real PID 1, so `docker compose stop` ends the scheduler at once.
    init: true
    entrypoint: ['/bin/sh', '/usr/local/bin/wondermoney-backup']
    command: ['schedule']
    environment:
      BACKUP_ROLE: offsite
      BACKUP_DESTINATION: ${BACKUP_DESTINATION:-}
      BACKUP_OFFSITE_SCHEDULE: ${BACKUP_OFFSITE_SCHEDULE:-30 2 * * *}
      BACKUP_OFFSITE_KEEP_DAYS: ${BACKUP_OFFSITE_KEEP_DAYS:-30}
      TZ: ${BACKUP_TZ:-UTC}
    volumes:
      - ./backup/backup.sh:/usr/local/bin/wondermoney-backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ./rclone:/config/rclone

volumes:
  caddy-config:
  caddy-data:
  postgres-data:
  storage-data:
