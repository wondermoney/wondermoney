# Self-hosted WonderMoney: Postgres, the API, its background worker and the web app.
#
#   ./generate-env.sh          # creates .env with fresh secrets (once)
#   docker compose up -d       # http://localhost:3000
#
# Optional extras, by profile (set COMPOSE_PROFILES in .env so every command includes them):
#   storage   SeaweedFS, an S3-compatible store for file uploads (CSV imports, receipt copies)
#   mail      Mailpit, to read outgoing mail at http://localhost:8025
#
# Set BIND_ADDRESS=127.0.0.1 in .env to publish the ports on this machine only, e.g. behind a
# reverse proxy on the same host.
#
# See README.md for HTTPS, upgrades and backups.

name: wondermoney

x-api-env: &api-env
  env_file: .env
  environment:
    DB_HOST: postgres
    DB_PORT: '5432'
    DB_DATABASE: ${POSTGRES_DB:-wondermoney}
    DB_USERNAME: ${POSTGRES_USER:-wondermoney}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?run ./generate-env.sh first}
    # pg-boss creates and upgrades its own schema; it takes a lock, so both can do it.
    PGBOSS_MIGRATE: 'true'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wondermoney}
      POSTGRES_USER: ${POSTGRES_USER:-wondermoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./generate-env.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies database migrations on every start (and, on an empty database, loads the reference
  # data), then serves the API.
  api:
    image: ${WM_IMAGE_REGISTRY:-ghcr.io/wondermoney}/wondermoney-api:${WM_VERSION:-latest}
    restart: unless-stopped
    <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${BIND_ADDRESS:+${BIND_ADDRESS}:}${API_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/v1/health']
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10

  # Background jobs: bank and price syncs, imports, scheduled emails. The only process that
  # runs the schedules.
  worker:
    image: ${WM_IMAGE_REGISTRY:-ghcr.io/wondermoney}/wondermoney-worker:${WM_VERSION:-latest}
    restart: unless-stopped
    <<: *api-env
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: ${POSTGRES_DB:-wondermoney}
      DB_USERNAME: ${POSTGRES_USER:-wondermoney}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run ./generate-env.sh first}
      PGBOSS_MIGRATE: 'true'
      PGBOSS_SCHEDULE: 'true'
    depends_on:
      api:
        condition: service_healthy

  # Only the settings the web app reads: it never sees the database password or the API's
  # secrets.
  web:
    image: ${WM_IMAGE_REGISTRY:-ghcr.io/wondermoney}/wondermoney-web:${WM_VERSION:-latest}
    restart: unless-stopped
    environment:
      # What browsers use.
      NEXT_PUBLIC_API_URL: ${API_URL:?set API_URL in .env}
      NEXT_PUBLIC_APP_URL: ${APP_URL:?set APP_URL in .env}
      # What the web server uses for its own requests (localhost would be the web container).
      API_INTERNAL_URL: http://api:3001
      NEXT_PUBLIC_AUTH_COOKIE_DOMAIN: ${NEXT_PUBLIC_AUTH_COOKIE_DOMAIN:-}
      NEXT_PUBLIC_TERMS_URL: ${NEXT_PUBLIC_TERMS_URL:-}
      NEXT_PUBLIC_PRIVACY_URL: ${NEXT_PUBLIC_PRIVACY_URL:-}
      NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${BIND_ADDRESS:+${BIND_ADDRESS}:}${WEB_PORT:-3000}:3000'

  # S3-compatible storage. AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in .env are its only
  # credentials; it refuses to start without them rather than serve files to anyone.
  storage:
    profiles: [storage]
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        [ -n "$${AWS_ACCESS_KEY_ID}" ] && [ -n "$${AWS_SECRET_ACCESS_KEY}" ]
        || { echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in .env first." >&2; exit 1; };
        exec weed server -dir=/data -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - storage-data:/data
    ports:
      - '${BIND_ADDRESS:+${BIND_ADDRESS}:}${S3_PORT:-9000}:8333'
    # The S3 gateway's own health endpoint: it answers once the gateway is serving.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:8333/healthz']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  # Creates the bucket once the store is healthy, then exits.
  storage-init:
    profiles: [storage]
    image: chrislusf/seaweedfs:4.48
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        until echo s3.bucket.list | weed shell -master=storage:9333 > /tmp/buckets 2>/dev/null; do sleep 2; done;
        if grep -qw "$${S3_BUCKET}" /tmp/buckets; then echo "bucket $${S3_BUCKET} exists";
        else echo "s3.bucket.create -name $${S3_BUCKET}" | weed shell -master=storage:9333; fi
    environment:
      S3_BUCKET: ${S3_BUCKET:-wondermoney}

  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:+${BIND_ADDRESS}:}${MAILPIT_PORT:-8025}:8025'

volumes:
  postgres-data:
  storage-data:
