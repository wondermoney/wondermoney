# WonderMoney on Render, for the "Deploy to Render" button (README.md and the docs site's
# "Managed hosting options" page, which walks through every prompt below).
#
#   wondermoney         the address people use: a small Caddy proxy that sends /v1/* and
#                       /api/auth/* to the API and everything else to the web app, so the web app
#                       and the API share one hostname and its sign-in cookie
#   wondermoney-api     the API; applies database migrations when it starts
#   wondermoney-web     the web app
#   wondermoney-worker  background jobs: bank and price syncs, imports, scheduled emails
#   wondermoney-db      Postgres, reachable only from these services
#
# The images are the released ones from GitHub Container Registry, pinned to one release. Each
# release bumps the three tags below (CONTRIBUTING.md, "Releasing"); a Blueprint with Auto Sync on
# then redeploys with the new images, and the API migrates the database as it starts.
#
# Nothing secret is committed here. `generateValue` secrets are created by Render once, on the
# first sync, and kept. `sync: false` values are asked for when the Blueprint is created and never
# overwritten by a later sync; everything else is reset to what this file says on every sync, so
# add your own settings in the dashboard instead of changing the values here.
#
# Every service and the database are in one region; Render can't move them later. To run
# elsewhere (oregon, ohio, virginia, singapore), fork the repository, change every `region` line
# and deploy from the fork. `pnpm --filter @wondermoney/api render:check` checks this file against
# the settings the API, the worker and the web app need to start.

envVarGroups:
  # Secrets the API and the worker share, generated by Render: a random base64 256-bit value each.
  - name: wondermoney-secrets
    envVars:
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: EMAIL_OPT_OUT_SIGNING_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: INTERNAL_SERVICE_API_KEY
        generateValue: true

services:
  # The front door. Render terminates HTTPS and forwards plain HTTP to Caddy on PORT.
  - type: web
    name: wondermoney
    runtime: image
    image:
      url: docker.io/library/caddy:2.10-alpine
    region: frankfurt
    plan: 0.5c-512mb
    healthCheckPath: /proxy-health
    # Writes the Caddyfile below from CADDYFILE, then starts Caddy. Render's form for a shell
    # command: everything after `-c` is the script.
    dockerCommand: /bin/sh -c printf '%s\n' "$CADDYFILE" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    envVars:
      # The address of this service, where people reach WonderMoney: your own domain
      # (https://money.example.com, added to this service as a custom domain after the deploy)
      # or its onrender.com address. The other services copy it on every Blueprint sync.
      - key: APP_URL
        sync: false
      - key: PORT
        value: 10000
      - key: API_HOSTPORT
        fromService:
          type: web
          name: wondermoney-api
          property: hostport
      - key: WEB_HOSTPORT
        fromService:
          type: web
          name: wondermoney-web
          property: hostport
      # Render's own proxy sits in front of this one, on its private network: trusting private
      # addresses keeps the visitor's address it adds to X-Forwarded-For, which the API's sign-in
      # limits key on (TRUST_PROXY on the API).
      - key: CADDYFILE
        value: |
          {
            admin off
            auto_https off
            servers {
              trusted_proxies static private_ranges
            }
          }

          :{$PORT} {
            handle /proxy-health {
              respond "ok" 200
            }
            handle /v1/* {
              reverse_proxy {$API_HOSTPORT}
            }
            handle /api/auth/* {
              reverse_proxy {$API_HOSTPORT}
            }
            handle {
              reverse_proxy {$WEB_HOSTPORT}
            }
          }

  - type: web
    name: wondermoney-api
    runtime: image
    image:
      url: ghcr.io/wondermoney/wondermoney-api:1.4.0
    region: frankfurt
    plan: 0.5c-512mb
    healthCheckPath: /v1/health
    envVars:
      - fromGroup: wondermoney-secrets
      # Encrypts each user's bank (Enable Banking) credentials: base64 of exactly 32 random bytes,
      # from `openssl rand -base64 32`. Keep a copy outside Render: a restored database needs the
      # same key. Never change it once in use.
      - key: CREDENTIAL_ENCRYPTION_KEY_V1
        sync: false
      # open: anyone can sign up · invite: only people invited to a household · closed: nobody.
      # The first account can always sign up, so invite is the safe choice for a personal server.
      - key: SIGNUP_MODE
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: wondermoney
          envVarKey: APP_URL
      # One hostname: the API is served at the web app's address, so no cookie domain is needed.
      - key: API_URL
        fromService:
          type: web
          name: wondermoney
          envVarKey: APP_URL
      - key: PORT
        value: 3001
      - key: PGBOSS_MIGRATE
        value: 'true'
      # Render's proxy and the front door, both on private addresses (see CADDYFILE).
      - key: TRUST_PROXY
        value: uniquelocal
      - key: DB_HOST
        fromDatabase:
          name: wondermoney-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: wondermoney-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: wondermoney-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: wondermoney-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: wondermoney-db
          property: password
      # File storage for CSV imports and receipt copies: any S3-compatible bucket (Cloudflare R2,
      # Backblaze B2, AWS S3). Leave empty to run without it; the worker asks for the same values.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false

  - type: web
    name: wondermoney-web
    runtime: image
    image:
      url: ghcr.io/wondermoney/wondermoney-web:1.4.0
    region: frankfurt
    plan: 0.5c-512mb
    healthCheckPath: /health
    envVars:
      # What browsers use, and (without API_INTERNAL_URL) what the web server's own requests use.
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: wondermoney
          envVarKey: APP_URL
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: wondermoney
          envVarKey: APP_URL
      - key: PORT
        value: 3000

  # The only process that runs the schedules: keep it at one instance.
  - type: worker
    name: wondermoney-worker
    runtime: image
    image:
      url: ghcr.io/wondermoney/wondermoney-worker:1.4.0
    region: frankfurt
    plan: 0.5c-512mb
    envVars:
      - fromGroup: wondermoney-secrets
      - key: CREDENTIAL_ENCRYPTION_KEY_V1
        fromService:
          type: web
          name: wondermoney-api
          envVarKey: CREDENTIAL_ENCRYPTION_KEY_V1
      - key: APP_URL
        fromService:
          type: web
          name: wondermoney
          envVarKey: APP_URL
      - key: API_URL
        fromService:
          type: web
          name: wondermoney
          envVarKey: APP_URL
      - key: PGBOSS_MIGRATE
        value: 'true'
      - key: PGBOSS_SCHEDULE
        value: 'true'
      - key: DB_HOST
        fromDatabase:
          name: wondermoney-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: wondermoney-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: wondermoney-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: wondermoney-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: wondermoney-db
          property: password
      # The same bucket as the API's: imports and exports read and write it from here.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false

databases:
  - name: wondermoney-db
    databaseName: wondermoney
    user: wondermoney
    # The major version the Docker Compose install and the Helm chart run.
    postgresMajorVersion: '16'
    region: frankfurt
    plan: 0.1c-256mb
    # No connections from outside Render's private network. Add your address here (or in the
    # dashboard) to run pg_dump from your own machine.
    ipAllowList: []
