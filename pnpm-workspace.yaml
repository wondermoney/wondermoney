packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@sentry/cli': true
  '@shopify/react-native-skia': true
  '@swc/core': true
  core-js: false
  cypress: false
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true

overrides:
  axios: '^1.18.0'
  fast-xml-parser: '^5.8.0'
  ip-address: '^10.3.1'
  qs: '^6.16.0'
  '@types/react': 19.2.17
  # One copy, so the API's Request augmentation reaches the type Express actually uses.
  '@types/express-serve-static-core': 5.1.3
  eslint-plugin-react-hooks>zod-validation-error: ^4.0.0

  react-native-worklets: 0.10.1
  react-native-reanimated: 4.5.1
  # The API's copy of @better-auth/expo (its server plugin) gets Expo peers installed for it;
  # keep them on the app's versions so the hoisted tree holds one copy. Bump with the Expo SDK.
  '@better-auth/expo>expo-constants': ~57.0.21
  '@better-auth/expo>expo-linking': ~57.0.12
  # React Native 0.86's renderer needs exactly this React; every app shares it.
  react: 19.2.3
  react-dom: 19.2.3

# Hoisted, like the Yarn 1 and npm layouts these apps were built on: Expo's circular peer
# dependencies make the isolated layout install several copies of expo and react-native.
nodeLinker: hoisted

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.29'
  - '@expo/fingerprint@0.20.14'
  - '@expo/inline-modules@0.1.8'
  - '@expo/local-build-cache-provider@57.0.9'
  - '@expo/prebuild-config@57.0.18'
  - babel-preset-expo@57.0.15
  - expo-modules-autolinking@57.0.15
  - expo-modules-core@57.0.22
  - expo-modules-jsi@57.1.2
  - expo@57.0.28
  - '@expo/ui@57.0.23'
  - expo-crypto@57.0.4
  - expo-dev-client@57.0.20
  - expo-dev-launcher@57.0.21
  - expo-dev-menu@57.0.20
  - expo-router@57.0.26
  - expo-sharing@57.0.23
  - expo-splash-screen@57.0.10
  - jest-expo@57.0.6
