packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@sentry/cli': true
  '@shopify/react-native-skia': true
  '@swc/core': true
  core-js: false
  cypress: false
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true

overrides:
  axios: '^1.18.0'
  fast-xml-parser: '^5.8.0'
  ip-address: '^10.3.1'
  qs: '^6.16.0'
  '@types/react': 19.2.17
  # One copy, so the API's Request augmentation reaches the type Express actually uses.
  '@types/express-serve-static-core': 5.1.3
  eslint-plugin-react-hooks>zod-validation-error: ^4.0.0

  react-native-worklets: 0.10.1
  react-native-reanimated: 4.5.1
  # better-auth's and @better-auth/expo's optional next/expo peers are dropped by .pnpmfile.cjs,
  # so they no longer resolve into the API's closure (#100).
  # React Native 0.86's renderer needs exactly this React; every app shares it.
  react: 19.2.3
  react-dom: 19.2.3
  # One copy of each Radix internal that keeps module-level state (the layer stack, the
  # focus-trap stack and its branch registry, the focus-guard count). Radix pins these
  # exactly per component, so web's older Select/DropdownMenu/AlertDialog and its newer
  # Dialog/Popover asked for different versions; the hoisted layout then gave Dialog and
  # Popover private copies each. A Dialog could not see a Popover inside it, so its focus
  # trap pulled focus out of every combobox search box (#64), and a DropdownMenu that
  # opened a Dialog left `pointer-events: none` on <body> after both closed (#65).
  # Bump these together with the @radix-ui packages in apps/web and fumadocs-ui.
  '@radix-ui/react-dismissable-layer': 1.2.1
  '@radix-ui/react-focus-guards': 1.2.0
  '@radix-ui/react-focus-scope': 1.3.1

# Hoisted, like the Yarn 1 and npm layouts these apps were built on: Expo's circular peer
# dependencies make the isolated layout install several copies of expo and react-native.
nodeLinker: hoisted

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.29'
  - '@expo/fingerprint@0.20.14'
  - '@expo/inline-modules@0.1.8'
  - '@expo/local-build-cache-provider@57.0.9'
  - '@expo/prebuild-config@57.0.18'
  - babel-preset-expo@57.0.15
  - expo-modules-autolinking@57.0.15
  - expo-modules-core@57.0.22
  - expo-modules-jsi@57.1.2
  - expo@57.0.28
  - '@expo/ui@57.0.23'
  - expo-crypto@57.0.4
  - expo-dev-client@57.0.20
  - expo-dev-launcher@57.0.21
  - expo-dev-menu@57.0.20
  - expo-router@57.0.26
  - expo-sharing@57.0.23
  - expo-splash-screen@57.0.10
  - jest-expo@57.0.6
