name: Publish self-hosting images

# Multi-arch api, worker and web images on GitHub Container Registry, for the docker compose
# install in apps/api/deploy/selfhost and the Helm chart in charts/wondermoney. The images build
# everything from source. A release tag also publishes the chart, as an OCI artifact at
# oci://ghcr.io/wondermoney/charts/wondermoney.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Each job asks for what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # Publishes only from the main repository, never from a fork. Until the move to the public
    # repository, the private one may publish too: its DEPLOY_REPO variable names it. Delete
    # that variable at the cutover.
    if: github.repository == 'wondermoney/wondermoney' || github.repository == vars.DEPLOY_REPO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: wondermoney-api
            dockerfile: apps/api/Dockerfile
            target: api
          - image: wondermoney-worker
            dockerfile: apps/api/Dockerfile
            target: worker
          - image: wondermoney-web
            dockerfile: apps/web/Dockerfile
            target: runner
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            WM_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The one-line installer, attached to the release with its checksum, so
  # https://github.com/wondermoney/wondermoney/releases/latest/download/install.sh always serves
  # the script that matches the images. Waits for the images: a release whose installer is
  # available before its images would fail on `docker compose up`.
  release:
    name: Attach the installer to the release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && (github.repository == 'wondermoney/wondermoney' || github.repository == vars.DEPLOY_REPO)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Attach install.sh and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd apps/api/deploy/selfhost
          sha256sum install.sh > install.sh.sha256
          # A tag pushed without a release gets one; `gh release create` in CONTRIBUTING.md
          # creates it first, and this then only adds the files.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "WonderMoney ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" install.sh install.sh.sha256 --clobber

  # The Helm chart, versioned as the release: the tag's version becomes both the chart version
  # and its appVersion, so chart 1.4.0 runs the 1.4.0 images by default. Waits for the images,
  # like the installer: a chart published before its images would fail to pull them.
  chart:
    name: Publish the Helm chart
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && (github.repository == 'wondermoney/wondermoney' || github.repository == vars.DEPLOY_REPO)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Package and push to oci://ghcr.io/${{ github.repository_owner }}/charts
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          helm lint --strict charts/wondermoney --set postgresql.enabled=true
          helm package charts/wondermoney --version "$version" --app-version "$version" --destination "$RUNNER_TEMP/chart"
          printf '%s' "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/wondermoney-$version.tgz" "oci://ghcr.io/$OWNER/charts"
