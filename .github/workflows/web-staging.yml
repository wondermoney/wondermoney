name: Web Staging
on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-staging.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Each job asks for what it needs.
permissions: {}
jobs:
  deploy-staging:
    # Deploys only from the main repository, never from a fork.
    if: github.repository == 'wondermoney/wondermoney'
    runs-on: ubuntu-latest
    # Typically 5-10 minutes.
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: web
      # The web app's public URL, from the environment.
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check deploy configuration
        run: |
          if [ -z "$NEXT_PUBLIC_APP_URL" ]; then
            echo "::error::The NEXT_PUBLIC_APP_URL variable is not set on the staging environment."
            exit 1
          fi
      - name: Clone repository
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @wondermoney/web run lint
      - name: Test
        run: pnpm --filter @wondermoney/web run test
      - name: Typecheck
        run: pnpm --filter @wondermoney/web run type-check
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
