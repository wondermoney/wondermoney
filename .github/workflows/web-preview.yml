name: Web Preview
# A Vercel preview of the web app for each open pull request that changes it: deployed when the
# pull request opens and on each push to it, not for branches without a pull request.
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-preview.yml'
# Each job asks for what it needs.
permissions: {}
# A new push to the pull request cancels the preview still building for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  deploy-preview:
    # Deploys only from the main repository's own branches: a fork's pull request gets no
    # secrets. Dependabot's pull requests get none either, so they can't deploy; CI still checks
    # them. The release pull request (develop into main) needs no preview: staging is develop.
    if: >-
      github.repository == 'wondermoney/wondermoney'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.actor != 'dependabot[bot]'
      && github.head_ref != 'develop'
    runs-on: ubuntu-latest
    # Typically 4-7 minutes.
    timeout-minutes: 30
    environment: preview
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: web
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      # The branch itself rather than the merge commit, as before: Vercel takes the branch name
      # and commit from the checkout.
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # No lint, tests or type-check here: CI runs them on the same pull request.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
