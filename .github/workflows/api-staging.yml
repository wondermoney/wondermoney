name: API Staging Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-staging.yml'
# Each job asks for what it needs.
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy-staging:
    # Deploys only from the main repository, never from a fork.
    if: github.repository == 'wondermoney/wondermoney'
    runs-on: ubuntu-latest
    # Typically 6-15 minutes, most of it waiting for CI; the CI wait alone may take 40.
    timeout-minutes: 75
    # Secrets, variables and protection rules come from the environment (repository-level
    # secrets still apply).
    environment: staging
    permissions:
      # Reads CI's runs for the gate below.
      actions: read
      contents: read
      # Pushes the images to GitHub Container Registry.
      packages: write
    env:
      # The Coolify instance's base URL, a secret so run logs (public in the public repository)
      # mask it, and the API's public base URL, an environment variable; both without a
      # trailing slash.
      DEPLOY_API_BASE: ${{ secrets.DEPLOY_API_BASE }}
      API_URL: ${{ vars.API_URL }}
    steps:
      # The deploy targets come from settings, so a missing one fails here instead of halfway
      # through the deploy.
      - name: Check deploy configuration
        run: |
          missing=0
          for name in DEPLOY_API_BASE API_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set (Settings > Secrets and variables > Actions: the DEPLOY_API_BASE secret, the API_URL variable of the staging environment)."
              missing=1
            fi
          done
          exit "$missing"
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Replace SHA in code
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: '##REPLACE_GITHUB_COMMIT_SHA_HERE##'
          replace: '${{ github.sha }}'
          regex: false
          include: 'apps/api/src/utils/constants.ts'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Everything is built here, while CI runs on the same commit; nothing is pushed before the
      # gate below. The first build exports the compiled API (the Dockerfile's `dist` target)
      # for the Sentry release, so Sentry gets the source maps of exactly the files the image
      # runs. The second builds the API image into this builder's cache and saves its layers to
      # the GitHub Actions cache, so that upload overlaps with CI too. The worker image is the
      # same layers with another CMD. After the gate, the pushes reuse this builder's cache.
      - name: Build the API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: dist
          outputs: type=local,dest=apps/api/dist
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
      - name: Build the images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            APP_ENV=staging
            DEPLOY_ENV=staging
          cache-from: type=gha,scope=api
          # mode=min saves the image's own layers (above all the production node_modules, which
          # only change with the lockfile), not the build stages: saving and restoring the
          # builder's multi-gigabyte dependency layer took longer than installing it again. A
          # failed upload costs the next deploy time, not this one.
          cache-to: type=gha,mode=min,scope=api,ignore-error=true
      # CI (.github/workflows/ci.yml) runs on this same commit, with type-check, lint and the
      # API tests with coverage thresholds; this deploy waits for it instead of running them a
      # second time. Nothing is pushed or deployed until CI has passed on exactly this SHA. The
      # API build above overlaps with it.
      - name: Wait for CI to pass on this commit
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion,url)
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI passed on ${GITHUB_SHA}: $(jq -r 'map(select(.conclusion == "success"))[0].url' <<<"$runs")"
              exit 0
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<<"$runs" >/dev/null; then
              echo "::error::CI did not pass on ${GITHUB_SHA}; not deploying."
              jq -r '.[] | "\(.conclusion) \(.url)"' <<<"$runs"
              exit 1
            fi
            echo "waiting for CI on ${GITHUB_SHA:0:9}: $(jq -r 'if length == 0 then "not started" else map(.status) | join(", ") end' <<<"$runs")"
            sleep 20
          done
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta API
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/api
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Docker meta worker
        id: meta-worker
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/api-worker
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      # Both images were built before the CI gate; these steps take them from the builder's
      # cache and upload them.
      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: apps/api/Dockerfile
          target: api
          cache-from: type=gha,scope=api
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            APP_ENV=staging
            DEPLOY_ENV=staging
      - name: Build and push worker
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: apps/api/Dockerfile
          target: worker
          cache-from: type=gha,scope=api
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            APP_ENV=staging
            DEPLOY_ENV=staging
      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: api
        with:
          environment: staging
          sourcemaps: './apps/api/dist'
      - name: Deploy API via Coolify
        run: |
          curl --fail -sS -X POST \
            "${DEPLOY_API_BASE}/api/v1/deploy?uuid=${{ secrets.COOLIFY_STAGING_API_UUID }}&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
      - name: Wait for API to serve the new commit
        run: |
          for _ in $(seq 1 60); do
            deployed=$(curl -sS "${API_URL}/v1/health" | jq -r '.gitCommitHash // empty' || true)
            if [ "$deployed" = "${{ github.sha }}" ]; then
              echo "API is serving ${deployed}"
              exit 0
            fi
            echo "waiting... currently: ${deployed:-unreachable}"
            sleep 10
          done
          echo "API did not report the new commit within 10 minutes" >&2
          exit 1
      - name: Deploy worker via Coolify
        id: deploy-worker
        run: |
          response=$(curl --fail -sS -X POST \
            "${DEPLOY_API_BASE}/api/v1/deploy?uuid=${{ secrets.COOLIFY_STAGING_WORKER_UUID }}&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          echo "$response"
          deployment_uuid=$(echo "$response" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$deployment_uuid" ]; then
            echo "Could not extract deployment_uuid from Coolify /deploy response: $response" >&2
            exit 1
          fi
          echo "deployment_uuid=${deployment_uuid}" >> "$GITHUB_OUTPUT"
      # A crash-looping worker otherwise reads as a green deploy here too -- staging is where
      # that should be caught, so it gets the same gate as production.
      - name: Wait for worker deployment to finish
        run: |
          deployment_uuid="${{ steps.deploy-worker.outputs.deployment_uuid }}"
          for _ in $(seq 1 60); do
            status=$(curl -sS "${DEPLOY_API_BASE}/api/v1/deployments/${deployment_uuid}" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" | jq -r '.status // empty')
            echo "worker deployment status: ${status:-unknown}"
            if [ "$status" = "finished" ]; then exit 0; fi
            if [ "$status" = "failed" ] || [ "$status" = "cancelled-by-user" ]; then
              echo "Worker deployment ended with status: $status" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Worker deployment did not finish within 10 minutes (last status: ${status:-unknown})" >&2
          exit 1
