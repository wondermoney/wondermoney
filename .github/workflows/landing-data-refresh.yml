name: Landing data refresh

# Regenerates the dated data snapshots behind the landing tools and, when the figures changed,
# opens or updates one pull request into develop per set of snapshots. A run with no new figures
# opens nothing. Four sets, each with its own fixed branch:
#
#   market  Euribor from BPstat, deposit rates from the ECB, household electricity prices from
#           Eurostat, fuel prices from DGEG, and the Série F savings certificates base rate from
#           IGCP. The sources publish monthly, so it runs on the 6th. IGCP sets the base rate on
#           the third-to-last business day of a month for the next month and posts its notice in
#           the last days of that month, so on the 6th the newest notice is the current month's.
#           The calculator default then trails a new rate by the days from the 1st to the merge,
#           and the page names the month of the rate it shows. A second run at the end of the month
#           would gain those days for one figure at the cost of a second pull request each month;
#           run the set by hand after IGCP's notice when the new rate matters sooner. Also the
#           committed fallback of the two daily snapshots, the cheapest fuel stations (DGEG) and
#           the gold price (NBP, ECB), which every production build refreshes anyway
#           (landing-daily-deploy.yml). Branch bot/landing-data-refresh.
#   offers  Every supplier's electricity offer, from ERSE's price simulator export. Offers start
#           and end every week, so it runs every Monday. Branch bot/landing-offers-refresh.
#   omie    OMIE's Portuguese day-ahead prices for the last 12 full months, with the E-REDES and
#           REN profiles they are weighted by (the indexed offers' real cost). A new month is
#           complete on the 1st, so it runs on the 8th, apart from the market set so that an OMIE
#           failure never holds up Euribor or fuel. Branch bot/landing-omie-refresh.
#   ppr     The PPR investment funds from the CMVM's list (Portal do Investidor), for the PPR
#           comparison. The list's annual returns and costs change rarely, so it runs monthly, on
#           the 10th, apart from the market set because it reads an OutSystems page whose screen
#           services can change with any CMVM deploy. The ASF half of the comparison (insurance and
#           pension funds) is refreshed by hand: the ASF site answers browsers only. Branch
#           bot/landing-ppr-refresh.
#
# A separate branch per set keeps a weekly offers run from rebuilding (and dropping) a market
# refresh that is still waiting for review, and a failure in one set from blocking the other.
# Run any of them by hand from Actions > Landing data refresh. The data modules and their other
# refresh paths (S&P 500, Portugal CPI, ERSE tariffs, the tax tables) are listed in
# apps/landing/AGENTS.md.
#
# A fetch or parse failure fails the job before anything is committed: the data stays as it is.
#
# The pull request is opened with GITHUB_TOKEN, and events made with that token start no
# workflows, so CI does not run on it. A maintainer starts it: close and reopen the pull request,
# or push an empty commit to the branch from a clone. Branch protection on develop needs that run.
#
# Creating the pull request needs the repository setting "Allow GitHub Actions to create and
# approve pull requests" (Settings > Actions > General). Without it the push still happens and the
# job fails at the pull request step; open it by hand (gh pr create --base develop --head
# <the set's branch>) and later runs keep it current.
on:
  schedule:
    # The set each schedule refreshes is chosen from github.event.schedule in the job below: keep
    # these strings and those in "Pick the snapshots" identical.
    - cron: '17 6 6 * *'
    - cron: '41 6 * * 1'
    - cron: '29 6 8 * *'
    - cron: '47 6 10 * *'
  workflow_dispatch:
    inputs:
      set:
        description: Which snapshots to refresh
        type: choice
        options: [market, offers, omie, ppr]
        default: market

permissions:
  contents: write
  pull-requests: write

# One run at a time; a set's branch is rebuilt from develop on every run of that set.
concurrency:
  group: landing-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the landing data snapshots
    # Only the main repository; forks have no develop to open the pull request against.
    if: github.repository == 'wondermoney/wondermoney'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_DIR: apps/landing/src/lib/calculators/data
      # Static data the page fetches (the OMIE quarter-hour prices), refreshed with the omie set.
      PUBLIC_DATA_DIR: apps/landing/public/data
    steps:
      - name: Pick the snapshots
        id: set
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SET: ${{ inputs.set }}
        run: |
          set -euo pipefail
          case "${SCHEDULE:-}" in
            '41 6 * * 1') set=offers ;;
            '17 6 6 * *') set=market ;;
            '29 6 8 * *') set=omie ;;
            '47 6 10 * *') set=ppr ;;
            *) set="${INPUT_SET:-market}" ;;
          esac
          if [ "$set" = offers ]; then
            {
              echo "scripts=build-electricity-offers"
              echo "branch=bot/landing-offers-refresh"
              echo "title=chore(landing): refresh the electricity offers"
              # The formulas of the indexed offers are checked against each new export's prices.
              echo "tests=electricityOffers indexedPricing"
            } >> "$GITHUB_OUTPUT"
          elif [ "$set" = ppr ]; then
            {
              echo "scripts=build-ppr-products"
              echo "branch=bot/landing-ppr-refresh"
              echo "title=chore(landing): refresh the PPR funds"
              echo "tests=pprComparison pprProductsScript PprComparison"
            } >> "$GITHUB_OUTPUT"
          elif [ "$set" = omie ]; then
            {
              echo "scripts=build-omie-prices"
              echo "branch=bot/landing-omie-refresh"
              echo "title=chore(landing): refresh the OMIE prices"
              echo "tests=indexedPricing omiePrices"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "scripts=build-euribor build-deposit-rates build-electricity-prices build-fuel-prices build-fuel-stations build-gold-price build-savings-certificates-rate"
              echo "branch=bot/landing-data-refresh"
              echo "title=chore(landing): refresh the market-data snapshots"
              echo "tests=euribor depositRate electricity fuel termDeposit TermDeposit rateRevision gold CheapestStations savingsCertificates SavingsCertificates"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "set=$set" >> "$GITHUB_OUTPUT"
          echo "Refreshing the $set snapshots." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          ref: develop
          # The token is kept: the job pushes the branch with it.
          persist-credentials: true
      - id: setup
        uses: ./.github/actions/setup-workspace
      - name: Fetch the snapshots
        working-directory: apps/landing
        env:
          SCRIPTS: ${{ steps.set.outputs.scripts }}
        run: |
          set -euo pipefail
          # Each script writes its module only after the fetch and the parse succeed, and a
          # failure stops the job here, so a failed run leaves the data as it was.
          for script in $SCRIPTS; do
            echo "::group::$script"
            node "scripts/$script.mjs" || { echo "::error::scripts/$script.mjs failed: the source did not answer or its format changed. The data was left as it was."; exit 1; }
            echo "::endgroup::"
          done
      - name: Check for new figures
        id: changes
        run: |
          set -euo pipefail
          # The scripts stamp today's date as the fetch date on every run, so a date-only diff is
          # not a data change: put those modules back.
          ignore='^[[:space:]]*(fetchedOn|retrievedOn):'
          if [ -z "$(git diff -I"$ignore" --numstat -- "$DATA_DIR" "$PUBLIC_DATA_DIR")" ]; then
            git checkout -- "$DATA_DIR" "$PUBLIC_DATA_DIR"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new figures; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --stat -- "$DATA_DIR" "$PUBLIC_DATA_DIR"
      - name: Run the related landing tests
        if: steps.changes.outputs.changed == 'true'
        working-directory: apps/landing
        env:
          TESTS: ${{ steps.set.outputs.tests }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # TESTS is a list of test name filters.
          VITEST_MAX_WORKERS=$(nproc) pnpm exec vitest run $TESTS
      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.set.outputs.branch }}
          TITLE: ${{ steps.set.outputs.title }}
          SET: ${{ steps.set.outputs.set }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          # As-of dates and the latest period, old (develop) and new (working tree), per module.
          field() { grep -m1 -E "^[[:space:]]*$2:" | sed -E 's/^[^"]*"([^"]*)".*/\1/'; }
          summary="| Data | Latest period | Source updated or retrieved |"$'\n'"|---|---|---|"$'\n'
          row() { # label file period-field date-field
            local file="$DATA_DIR/$2" old_p new_p old_d new_d
            old_p=$(git show "HEAD:$file" | field x "$3"); new_p=$(field x "$3" < "$file")
            old_d=$(git show "HEAD:$file" | field x "$4"); new_d=$(field x "$4" < "$file")
            if [ -n "$(git diff --numstat -I'^[[:space:]]*(fetchedOn|retrievedOn):' -- "$file")" ]; then
              summary+="| $1 | ${old_p} to **${new_p}** | ${old_d} to **${new_d}** |"$'\n'
            fi
          }
          row "Euribor (BPstat)" euribor.ts lastMonth fetchedOn
          row "Deposit rates (ECB MIR)" depositRates.ts lastMonth retrievedOn
          row "Electricity prices (Eurostat)" electricityPrices.ts lastPeriod updatedOn
          row "Fuel prices (DGEG)" fuelPrices.ts asOf fetchedOn
          row "Fuel stations (DGEG)" fuelStations/index.ts asOf fetchedAt
          row "Gold price (NBP, ECB)" goldPrice.ts asOf fetchedOn
          row "OMIE prices (Portugal)" omiePrices.ts lastMonth fetchedOn
          row "Série F base rate (IGCP)" savingsCertificatesRate.ts month publishedOn
          row "Electricity offers (ERSE export date)" electricityOffers.ts exportedOn fetchedOn
          row "PPR funds (CMVM)" pprFunds.ts fetchedOn fetchedOn

          body_file=$(mktemp)
          {
            echo "Scheduled refresh of the landing $SET snapshots, generated by"
            echo "\`.github/workflows/landing-data-refresh.yml\` (run $GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID)."
            echo
            printf '%s' "$summary"
            echo
            echo "The related landing tests passed in the workflow."
            echo
            echo "This pull request was opened with the workflow token, so CI did not start. Close and reopen it to run CI before merging."
            echo "Review the diff for plausible figures: the scripts only check the shape of the response."
          } > "$body_file"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add -- "$DATA_DIR" "$PUBLIC_DATA_DIR"
          git commit -m "$TITLE"
          # The branch belongs to this workflow and is rebuilt from develop on every run.
          git push --force origin "$BRANCH"

          existing=$(gh pr list --repo "$repo" --head "$BRANCH" --base develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$repo" --body-file "$body_file"
            echo "Updated pull request #$existing" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --repo "$repo" --base develop --head "$BRANCH" \
              --title "$TITLE" \
              --body-file "$body_file" --label skip-release-notes)
            echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
