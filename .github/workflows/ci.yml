name: CI

# Runs on every pull request (forks included: no secrets needed) and on the long-lived
# branches, on GitHub-hosted runners (free for public repositories). Turbo runs each task only in
# the packages that have it. Pushes and manual runs check everything; a pull request that changes
# only apps/ and packages/ checks the packages it affects and skips the jobs of the apps it does
# not (.github/scripts/ci-scope.sh, the "Affected apps" job).
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Pushes to develop and main get a group
# per commit instead, so every commit there finishes its run: the release pull request's required
# check (release-pr.yml) and the API deploy workflows (api-staging.yml, api-production.yml) rely
# on CI having passed on that exact commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  # Where turbo keeps its local cache, which the jobs below carry between runs.
  TURBO_CACHE_DIR: .turbo/cache
  # What `turbo run --affected` compares against: on a pull request's merge commit, the base
  # branch (ci-scope.sh passes --affected only on pull requests).
  TURBO_SCM_BASE: HEAD^1

jobs:
  # Which apps a pull request affects, for the jobs that don't run through turbo (the API, web
  # E2E and mobile extras): every app on a full run, otherwise the ones `turbo ls --affected`
  # lists (an app is affected by its own changes and by those of the packages it depends on).
  # It also reports whether the self-hosting files changed, for the shellcheck and install jobs:
  # those build images, so they stay off an unrelated change.
  changes:
    name: Affected apps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      api: ${{ steps.apps.outputs.api }}
      web: ${{ steps.apps.outputs.web }}
      mobile: ${{ steps.apps.outputs.mobile }}
      selfhost: ${{ steps.apps.outputs.selfhost }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        run: .github/scripts/ci-scope.sh
      - if: steps.scope.outputs.affected != ''
        uses: pnpm/action-setup@v6
      - if: steps.scope.outputs.affected != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.scope.outputs.affected != ''
        run: pnpm install --frozen-lockfile --ignore-scripts
      - id: apps
        env:
          AFFECTED: ${{ steps.scope.outputs.affected }}
        run: |
          if [ -z "$AFFECTED" ]; then
            packages='["@wondermoney/api","@wondermoney/web","@wondermoney/mobile"]'
          else
            packages=$(pnpm turbo ls --affected --output=json | sed -n '/^{/,$p' | jq -c '[.packages.items[].name]')
          fi
          echo "Affected: $packages"
          for app in api web mobile; do
            echo "$app=$(jq -r --arg p "@wondermoney/$app" 'index($p) != null' <<<"$packages")" >> "$GITHUB_OUTPUT"
          done

          # The self-hosting files the installer and the compose file live in, and the two
          # workflows that ship them. A run with no base commit to compare against runs the jobs.
          selfhost=false
          if changed=$(git diff --name-only HEAD^1 HEAD 2>/dev/null); then
            if grep -qE '^(apps/api/deploy/selfhost/|\.github/workflows/(ci|publish-images)\.yml$)' <<<"$changed"; then
              selfhost=true
            fi
          else
            selfhost=true
          fi
          echo "selfhost=$selfhost" >> "$GITHUB_OUTPUT"

  # Type-check, lint, the tests of every package but the API, and the builds run as parallel jobs;
  # "Type-check, lint, test and build", further down, gathers them under the one check name they
  # used to share as a single job.
  #
  # Each of these jobs keeps turbo's cache between runs with actions/cache, keyed by job, resolved
  # Node version and commit; a run restores the newest entry of its branch or of the base branch.
  # A task whose inputs did not change replays its logs and outputs instead of running. Turbo's
  # hash covers the package's files, the hashes of the workspace packages it depends on (a change
  # to packages/shared re-runs everything that uses it), its locked dependencies and the
  # globalDependencies in turbo.json (a lockfile or workspace change re-runs everything). On a
  # full run the prune step then drops the entries this run did not use, so the cache does not
  # grow; an affected-only pull request run keeps them all, as it used only some.
  lint:
    name: Type-check and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: .github/scripts/ci-scope.sh
      - uses: pnpm/action-setup@v6
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-lint-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ github.sha }}
          restore-keys: turbo-lint-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-
      # Two at a time: the API's type-check and typed lint each need up to 4 GB.
      - run: pnpm turbo run type-check lint ${{ steps.scope.outputs.affected }} --concurrency=2 --summarize
      - if: steps.scope.outputs.affected == ''
        run: .github/scripts/prune-turbo-cache.sh

  # The self-hosting scripts are shell, which no turbo task covers: apps/api/deploy/selfhost is
  # not a package. install.sh is what a new instance runs first, so it is checked as POSIX sh.
  shellcheck:
    name: Shellcheck
    needs: changes
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The runner image ships shellcheck; the fallback is for the day it stops.
      - name: Install shellcheck if the runner lacks it
        run: command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
      - name: shellcheck
        run: shellcheck -s sh apps/api/deploy/selfhost/install.sh apps/api/deploy/selfhost/generate-env.sh

  # The tests of every package but the API (the "API tests" jobs, on runners of their own:
  # sharing a runner with other packages' tests pushed some past their timeouts) and the mobile
  # app (the next job).
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: .github/scripts/ci-scope.sh
      - uses: pnpm/action-setup@v6
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-test-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ github.sha }}
          restore-keys: turbo-test-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-
      # Vitest's default is one worker fewer than the cores, while the main process mostly waits:
      # a worker per core is faster on a runner that runs nothing else.
      - run: VITEST_MAX_WORKERS=$(nproc) pnpm turbo run test ${{ steps.scope.outputs.affected }} --filter='!@wondermoney/api' --filter='!@wondermoney/mobile' --summarize
      - if: steps.scope.outputs.affected == ''
        run: .github/scripts/prune-turbo-cache.sh

  mobile-test:
    name: Mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: .github/scripts/ci-scope.sh
      - uses: pnpm/action-setup@v6
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-mobile-test-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ github.sha }}
          restore-keys: turbo-mobile-test-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-
      # Jest's transform cache: the Babel output for the app and for React Native's untranspiled
      # modules. Entries are keyed by file content and transform config, so a stale one is never
      # used. Started afresh when the lockfile changes, so it does not grow without bound.
      - uses: actions/cache@v6
        with:
          path: apps/mobile/node_modules/.cache/jest
          key: jest-mobile-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: jest-mobile-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # jest.config.js's maxWorkers (25%, for a busy development machine) is one worker on a
      # four-vCPU runner; this runner runs nothing else.
      - run: pnpm turbo run test ${{ steps.scope.outputs.affected }} --filter=@wondermoney/mobile --summarize -- --maxWorkers="$(nproc)" --cacheDirectory=node_modules/.cache/jest
      - if: steps.scope.outputs.affected == ''
        run: .github/scripts/prune-turbo-cache.sh

  # The web app on one runner, everything else on another: on one runner the Next.js builds and the
  # API compile had to run one at a time, as they don't fit in memory together.
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: web
            name: web
            filter: '@wondermoney/web'
          # Docs, the email templates, the marketing site and the API.
          - id: rest
            name: docs, email, landing, API
            filter: '!@wondermoney/web'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: .github/scripts/ci-scope.sh
      - uses: pnpm/action-setup@v6
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-build-${{ matrix.id }}-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ github.sha }}
          restore-keys: turbo-build-${{ matrix.id }}-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-
      - name: Build
        run: pnpm turbo run build ${{ steps.scope.outputs.affected }} --filter='${{ matrix.filter }}' --concurrency=1 --summarize
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_SITE_URL: https://docs.wonder.money
      - if: steps.scope.outputs.affected == ''
        run: .github/scripts/prune-turbo-cache.sh

  # The installer, end to end: builds the three images from this commit, runs install.sh --yes
  # against them (the --source flag copies the compose file and generate-env.sh from the
  # checkout instead of a release tag), waits for the health endpoint, then runs it again and
  # checks that .env is unchanged. Gated on the self-hosting files: the image build is the
  # expensive part, and nothing else in the tree can break the compose contract.
  install:
    name: Install script
    needs: changes
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ci
    steps:
      - uses: actions/checkout@v7
      # The Dockerfiles use `RUN --mount=type=cache`, which the classic builder does not support.
      - uses: docker/setup-buildx-action@v4
      - name: Build the images the installer starts
        run: |
          set -euo pipefail
          for target in api worker; do
            docker buildx build --load --target "$target" \
              -f apps/api/Dockerfile \
              --build-arg WM_VERSION="$VERSION" \
              -t "ghcr.io/wondermoney/wondermoney-$target:$VERSION" .
          done
          docker buildx build --load --target runner \
            -f apps/web/Dockerfile \
            --build-arg WM_VERSION="$VERSION" \
            -t "ghcr.io/wondermoney/wondermoney-web:$VERSION" .
      - name: Install
        env:
          DIR: ${{ runner.temp }}/wondermoney
          # A runner's first boot is slower than a real host's; the installer's own default is
          # 180 seconds.
          WM_HEALTH_TIMEOUT: '300'
        run: |
          sh apps/api/deploy/selfhost/install.sh --yes --version "$VERSION" \
            --source apps/api/deploy/selfhost --dir "$DIR"
          curl -fsS "http://127.0.0.1:3001/v1/health"
      - name: Re-running leaves .env alone
        env:
          DIR: ${{ runner.temp }}/wondermoney
        run: |
          set -euo pipefail
          before=$(sha256sum "$DIR/.env")
          sh apps/api/deploy/selfhost/install.sh --yes --version "$VERSION" \
            --source apps/api/deploy/selfhost --dir "$DIR"
          after=$(sha256sum "$DIR/.env")
          if [ "$before" != "$after" ]; then
            echo "::error::.env changed on a re-run: $before -> $after"
            exit 1
          fi
          echo "Re-run left .env byte-for-byte unchanged."
      - name: Compose logs
        if: failure()
        env:
          DIR: ${{ runner.temp }}/wondermoney
        run: |
          if [ -f "$DIR/docker-compose.yml" ]; then
            docker compose -f "$DIR/docker-compose.yml" logs --tail 100
          fi
      - name: Stop
        if: always()
        env:
          DIR: ${{ runner.temp }}/wondermoney
        run: |
          if [ -f "$DIR/docker-compose.yml" ]; then
            docker compose -f "$DIR/docker-compose.yml" down -v
          fi

  # Secrets and text that must not be published in this public repository. gitleaks checks a pull
  # request's commits (a push: the whole tree) against the default rules and the allowlist in
  # .gitleaks.toml. leak-check.sh greps the tree, and a pull request's added lines and commit
  # messages, for the patterns in .github/leak-patterns.txt and, where secrets are available
  # (pushes and same-repository pull requests, not forks), the maintainers' private list in the
  # LEAK_PATTERNS secret. CONTRIBUTING.md, "Leak check", covers false positives.
  leak-check:
    name: Leak check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's commits, not only the merge result.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          case "$(uname -m)" in
            x86_64) arch=x64; sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            aarch64) arch=arm64; sha256=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            *) echo "::error::No gitleaks checksum for $(uname -m)"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          echo "$sha256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan for secrets (gitleaks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$HEAD_SHA" ]; then
            gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="--no-merges $BASE_SHA..$HEAD_SHA"
          else
            gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
          fi
      - name: Scan for internal identifiers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          if [ -z "$LEAK_PATTERNS" ]; then
            echo "::notice::LEAK_PATTERNS is not available to this run (a fork's pull request, or the secret is unset): checking the public patterns only."
          fi
          .github/scripts/leak-check.sh ${HEAD_SHA:+"$BASE_SHA..$HEAD_SHA"}

  # The single check these jobs replaced, kept so anything that looks for it by name still finds
  # it: it passes only when every one of them passed. It gathers the leak check too, so the
  # required check covers it, and "Affected apps", so a failure there can't pass by skipping the
  # app jobs that depend on it.
  checks:
    name: Type-check, lint, test and build
    needs: [changes, lint, test, mobile-test, build, leak-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check job to have passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null

  api:
    name: API extras
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # Typically 2-3 minutes; the timeout is there to catch a hang.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    # Disposable database for the migration snapshot check below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wmdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wondermoney/shared --filter @wondermoney/react-email run build:lib
      - name: Check the public token OpenAPI document is current
        run: pnpm run openapi -- --check
      - name: Check the OpenAPI spec is not stale
        run: |
          pnpm run swagger
          if ! git diff --quiet -- src/generated/swagger.json; then
            echo "::error::apps/api/src/generated/swagger.json is stale. Run 'pnpm --filter @wondermoney/api swagger' and commit the result."
            git diff --stat -- src/generated/swagger.json
            exit 1
          fi
      # Applies the whole chain to an empty database, then checks that applying did not touch
      # the committed snapshot and that the snapshot matches the entities (a hand-written
      # migration whose entity change was not reflected in the snapshot fails here).
      - name: Check migrations apply cleanly and the snapshot is current
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_DATABASE: wmdb
          DB_USERNAME: postgres
          DB_PASSWORD: ci
          CREDENTIAL_ENCRYPTION_KEY_V1: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          EMAIL_OPT_OUT_SIGNING_SECRET: ci-only
        run: |
          pnpm run migrate:dev
          if [ -n "$(git status --porcelain -- src/database/migrations)" ]; then
            echo "::error::Applying migrations changed src/database/migrations. Migration apply must not write the snapshot."
            git status --short -- src/database/migrations
            exit 1
          fi
          if ! pnpm run migrate:dev:check; then
            echo "::error::src/database/migrations/.snapshot-wmdb.json does not match the entities. Regenerate it with 'pnpm --filter @wondermoney/api migrate:dev:create' against a local database migrated to the head of the chain, and commit it with the migration."
            exit 1
          fi
      # Reporting-only: known, triaged advisories remain in the production tree.
      - name: Audit production dependencies
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

  # The API suite (~4,400 tests) split across runners. Each shard records its results and coverage
  # in a blob report; "API coverage" merges them and enforces the thresholds once, on the whole
  # suite (vitest.config.ts: a shard's own coverage is partial, so it checks none).
  api-tests:
    name: API tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # A shard typically takes 3-4 minutes, setup included; the timeout is there to catch a hang.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/api
    # The server on which tests of concurrent sessions create (and drop) their own throwaway
    # database (pg-test-db.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wmdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wondermoney/shared --filter @wondermoney/react-email run build:lib
      - name: Tests (shard ${{ matrix.shard }} of 3)
        env:
          # Lets the tests that need several real sessions (pg-test-db.ts) run; skipped elsewhere.
          TEST_POSTGRES_URL: postgres://postgres:ci@localhost:5432/wmdb
          VITEST_COVERAGE_PARTIAL: '1'
        run: pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/3 --reporter=dot --reporter=blob
      - uses: actions/upload-artifact@v7
        with:
          name: api-test-blob-${{ matrix.shard }}
          path: apps/api/.vitest/blob
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  api-coverage:
    name: API coverage
    needs: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: api-test-blob-*
          merge-multiple: true
          path: apps/api/.vitest/blob
      # Re-reports every shard's results (failing if any test failed) and enforces the coverage
      # thresholds in vitest.config.ts on the merged coverage.
      - name: Merge shard reports and enforce coverage thresholds
        run: pnpm exec vitest run --merge-reports --coverage --reporter=dot

  # Browser smoke tests: the Cypress specs that need only the web dev server (anonymous
  # redirects, login page, mobile navigation). No API or database is started; the
  # portfolio-import lane stays pending here because it needs the disposable local stack
  # described in apps/web/docs/qa/worktree-e2e.md. Roughly 3-5 runner minutes per run, most
  # of it the install and the first webpack compile.
  web-e2e:
    name: Web E2E smoke
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `cypress: false` in allowBuilds keeps the binary out of every install, so fetch it
      # here only, cached per lockfile.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec cypress install
      - name: Run Cypress headless
        run: pnpm e2e:headless
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_TELEMETRY_DISABLED: '1'
          # Opens the analytics gate a production build opens, with no keys set, as on a
          # default self-hosted instance: no-tracking.cy.ts asserts nothing loads.
          NEXT_PUBLIC_ENABLE_ANALYTICS: '1'
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: apps/web/cypress/screenshots
          if-no-files-found: ignore

  mobile:
    name: Mobile extras
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Expo tooling stays on Node 24 until Expo states Node 26 support.
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate EAS configuration syntax
        run: node -e "JSON.parse(require('node:fs').readFileSync('eas.json', 'utf8'))"
      # Reported, not enforced, for the same reason as Expo Doctor below: Expo's SDK patch
      # releases make it fail with no change here. Act on it with `npx expo install --fix`.
      - name: Check Expo dependency compatibility
        continue-on-error: true
        run: pnpm exec expo install --check
      # Reported, not enforced: its SDK patch-version check fails whenever Expo publishes a
      # patch. Read its output when touching mobile dependencies (it also catches duplicate
      # native modules).
      - name: Run Expo Doctor
        continue-on-error: true
        run: pnpm dlx expo-doctor@1.20.1
