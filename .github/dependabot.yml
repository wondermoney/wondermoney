version: 2
updates:
  # One pnpm lockfile for the whole repository. Weekly, minor+patch grouped per dependency
  # class; majors stay individual because they need reading. Expo packages are excluded:
  # they move with the Expo SDK (`npx expo install --fix`), not one by one.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Lisbon
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      # MikroORM's packages pin each other to the exact version, so every update, majors
      # included, moves them together in one PR.
      mikro-orm:
        patterns: ['@mikro-orm/*']
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Exact pins: timezone data, and a job-queue schema version coupled to the database.
      - dependency-name: date-fns-tz
        update-types: ['version-update:semver-major']
      # pg-boss owns a database schema; upgrade it deliberately (PGBOSS_MIGRATE).
      - dependency-name: pg-boss
      # tsc-alias 1.9.8 rewrites package subpath imports to files the packages do not export
      # (`@mikro-orm/decorators/legacy` became `.../legacy/index.js`), which breaks the built API.
      - dependency-name: tsc-alias
        versions: ['1.9.8']
      # kysely is pinned by @mikro-orm/sql; the API's copy must be the same version, so it moves
      # by hand together with a MikroORM update.
      - dependency-name: kysely
      # @types/node's major is the Node runtime's major: 26 everywhere (.nvmrc and both
      # Dockerfiles) except apps/mobile, which stays on 24 (apps/mobile/.nvmrc) until Expo
      # supports 26. Dependabot would move all of them to the newest Node, so change the major
      # by hand together with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # ESLint 10 is blocked upstream: eslint-plugin-react, eslint-plugin-import and
      # eslint-plugin-jsx-a11y (pulled in by eslint-config-next and eslint-config-expo) have no
      # ESLint 10 release, and eslint-plugin-react crashes under it.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # TypeScript 7.0 (the Go port) ships no programmatic API: `require('typescript')` only
      # exports the version. typescript-eslint 8.x throws on load under it (peer range
      # <6.1.0), which breaks lint in every package, and apps/web's i18n check script uses
      # the compiler API. Unblocked by typescript-eslint support for TS 7.1's new API
      # (typescript-eslint/typescript-eslint#10940). 6.x updates still come through.
      - dependency-name: typescript
        versions: ['7.x']
      # SheetJS stopped publishing to npm at 0.18.5; fixed releases are only on its CDN, so
      # packages/shared installs xlsx from a cdn.sheetjs.com tarball URL, which Dependabot can't
      # update. Bump it by hand: https://cdn.sheetjs.com/ lists releases, and
      # https://docs.sheetjs.com/docs/getting-started/installation/nodejs the install line.
      - dependency-name: xlsx
      # React Native's renderer needs its exact React version; both move with the Expo SDK.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-is
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-dom'
      - dependency-name: '@shopify/react-native-skia'
      - dependency-name: 'expo*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react-native*'
      - dependency-name: '@react-native/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']

  # Bumps the pinned base-image tags and digests within the Node major.
  - package-ecosystem: docker
    directories: ['/apps/api', '/apps/web']
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Odd Node majors never become LTS. Move the major by hand, to the next LTS, together with
      # .nvmrc, engines and @types/node.
      - dependency-name: node
        update-types: ['version-update:semver-major']
