version: 2
updates:
  # One pnpm lockfile for the whole repository. Weekly, minor+patch grouped per dependency
  # class; majors stay individual because they need reading. Expo packages are excluded:
  # they move with the Expo SDK (`npx expo install --fix`), not one by one.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Lisbon
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Exact pins: timezone data, and a job-queue schema version coupled to the database.
      - dependency-name: date-fns-tz
        update-types: ['version-update:semver-major']
      # pg-boss owns a database schema; upgrade it deliberately (PGBOSS_MIGRATE).
      - dependency-name: pg-boss
      # knex is pinned by MikroORM; the API's copy (test types only) must match it.
      - dependency-name: knex
      # Newer typescript-eslint flags assertions TypeScript 5.9 still needs; upgrade it
      # together with TypeScript, by hand.
      - dependency-name: typescript-eslint
      - dependency-name: '@typescript-eslint/*'
      # React Native's renderer needs its exact React version; both move with the Expo SDK.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-is
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-dom'
      - dependency-name: '@shopify/react-native-skia'
      - dependency-name: 'expo*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react-native*'
      - dependency-name: '@react-native/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']

  # Bumps the pinned base-image digests.
  - package-ecosystem: docker
    directories: ['/apps/api', '/apps/web']
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
